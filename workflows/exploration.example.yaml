# =============================================================================
# Exploration — answer a question, don't ship a change
# =============================================================================
#
# Selected by the routing rules in workflow.example.yaml. Runtime config —
# tracker, workspace, hooks, concurrency, the dashboard — lives there and is
# shared by every workflow; only the pipeline and its framing live here.
#
# The `prompts.global_prompt` below is what lets the stage prompts stay free of
# `if this is a bug…` branching: it says once what kind of work this is, so a
# shared review prompt needs no conditional.
# =============================================================================

description: "Open questions and spikes. The deliverable is a decision, not a merge."

prompts:
  # Loaded in order: the shared ground rules, then what is specific to
  # this kind of work. The specialised file supplements the base one.
  global_prompt:
    - prompts/global.example.md
    - prompts/global-exploration.example.md

states:

  # No implement, no merge, no PR. An exploration that quietly turns into a
  # code change has skipped the decision it existed to inform — so the pipeline
  # simply has nowhere to write code. If the answer is "yes, build it", that
  # becomes a new ticket, routed to the feature workflow.

  investigate:
    type: agent
    prompt: prompts/explore.example.md
    linear_state: active
    model: claude-opus-5
    effort: xhigh
    session: inherit
    transitions:
      complete: ground-check

  ground-check:
    type: agent
    prompt: prompts/ground-check.example.md
    linear_state: active
    model: claude-opus-5
    effort: xhigh
    session: fresh
    transitions:
      complete: findings-review

  findings-review:
    type: gate
    linear_state: review
    rework_to: investigate
    max_rework: 3
    transitions:
      approve: done

  done:
    type: terminal
    linear_state: terminal
